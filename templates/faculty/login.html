{% extends "base.html" %}
{% block title %}Faculty Login{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-circle"><i class="fas fa-chalkboard-teacher"></i></div>
      <h2>Faculty Login</h2>
      <p class="subtitle">Expert Panel Portal — Faculty Access</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="faculty@college.edu" required autofocus>
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Enter your password" required>
        <small class="text-muted">Use the temporary password sent to your email.</small>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:8px;">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>
    <div style="text-align:center;margin-top:20px;">
      <a href="{{ url_for('main.index') }}" style="color:#999;font-size:0.85rem;">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
