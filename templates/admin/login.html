{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-circle"><i class="fas fa-user-shield"></i></div>
      <h2>Admin Login</h2>
      <p class="subtitle">Expert Panel Recommendation System</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label for="username"><i class="fas fa-user"></i> Username</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="Enter admin username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:8px;">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>
    <div style="text-align:center;margin-top:20px;">
      <a href="{{ url_for('main.index') }}" style="color:#999;font-size:0.85rem;">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
